name: 🧠 Cerebro IA (Google Gemini) - Polymarket + Alpaca 24/7

on:
  schedule:
    # Respaldo automático cada hora en los servidores de GitHub
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'polymarket_ledger.json'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch: # Permite ejecutarlo manualmente con 1 clic desde GitHub o por API

concurrency:
  group: trading-cloud-runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_APT_KEY: ${{ secrets.ALPACA_APT_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RISK_PER_TRADE_USD: "2500.0"
      TAKE_PROFIT_PCT: "0.025"
      STOP_LOSS_PCT: "0.010"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv requests openai

      - name: Generar archivo de configuración (.env)
        run: |
          python setup_env.py

      - name: 🚀 Ejecutar Cerebro IA (Gemini) en Polymarket y Alpaca
        run: |
          python run_ai_cycle.py

      - name: Guardar estado de apuestas (polymarket_ledger.json)
        run: |
          git config user.name "AI-Trading-Bot[bot]"
          git config user.email "bot@trading.ai"
          git add polymarket_ledger.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update polymarket ledger [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          )

      - name: 🔄 Despertar siguiente ciclo en la nube (10 minutos)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Esperando 10 minutos (600s) para encadenar el siguiente ciclo continuo..."
          sleep 600
          if [ -n "$GH_PAT" ]; then
            echo "Enviando señal para despertar el siguiente ciclo en GitHub Actions..."
            curl -s -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/mfg09sp/trading-bot/actions/workflows/trading_cycle.yml/dispatches \
              -d '{"ref":"main"}' || true
          fi
